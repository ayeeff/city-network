name: city-network-granular-sync
# Triggers the Cloudflare Worker (city-network) to transform and synchronize
# the 19 granular urban dataset files directly on Cloudflare R2 (globe/data/).

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'City slug (e.g. amsterdam, melbourne, berlin, or all)'
        required: true
        default: 'all'
      batch:
        description: 'Batch size per Worker request'
        required: false
        default: '15'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Trigger Cloudflare Worker Transformation
        env:
          WORKER_URL: 'https://city-network.foodstarmelbourne.workers.dev'
        run: |
          bun run scripts/dispatch-worker.mjs --city "${{ inputs.city }}" --batch "${{ inputs.batch }}"
