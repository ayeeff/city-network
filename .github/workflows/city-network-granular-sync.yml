name: city-network-granular-sync
# Ingests and synchronizes the 19 granular urban dataset files
# (districts, areas, pois, landmarks, streets, baseline, tram, etc.)
# directly to Cloudflare R2 (geo-datalake and globe).

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'City slug (e.g. amsterdam, berlin, or all)'
        required: true
        default: 'all'
      concurrency:
        description: 'Parallel batch size'
        required: false
        default: '8'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install

      - name: Transform and Sync Granular 19 Datasets to R2
        env:
          R2_DATALAKE_ACCOUNT_ID: ${{ secrets.R2_DATALAKE_ACCOUNT_ID }}
          R2_DATALAKE_ACCESS_KEY_ID: ${{ secrets.R2_DATALAKE_ACCESS_KEY_ID }}
          R2_DATALAKE_SECRET_ACCESS_KEY: ${{ secrets.R2_DATALAKE_SECRET_ACCESS_KEY }}
        run: |
          bun run scripts/transform-all-to-granular-19.mjs --city "${{ inputs.city }}" --concurrency "${{ inputs.concurrency }}"
